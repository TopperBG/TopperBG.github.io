name: Add Energy Map favicon

on:
  push:
    paths:
      - '.github/workflows/add-map-favicon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon metadata
        shell: python
        run: |
          from pathlib import Path
          p=Path('Pozharite-Bulgaria-interactivna-karta.html')
          s=p.read_text(encoding='utf-8')
          icon='''<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2213%22 fill=%22%231b5e20%22/%3E%3Ccircle cx=%2245%22 cy=%2219%22 r=%229%22 fill=%22%23ffd54f%22/%3E%3Cpath d=%22M10 42l12-16 10 9 9-8 13 15v10H10z%22 fill=%22%238bc34a%22/%3E%3Cpath d=%22M11 47c10-6 20-5 29-1 6 3 10 3 14 1%22 fill=%22none%22 stroke=%22white%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">\n<meta name="apple-mobile-web-app-title" content="ЕнергоКарта България">\n'''
          if 'rel="icon"' not in s:
              s=s.replace('</title>', '</title>\n'+icon, 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "TopperBG map bot"
          git config user.email "actions@users.noreply.github.com"
          git add Pozharite-Bulgaria-interactivna-karta.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "UI: add Energy Map favicon for bookmarks"
          git push
