name: Refresh industrial concessions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  push:
    paths:
      - "scripts/refresh-industrial-concessions.py"
      - ".github/workflows/refresh-industrial-concessions.yml"

permissions:
  contents: write

concurrency:
  group: refresh-industrial-concessions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh official Pernik concession polygons
        run: python scripts/refresh-industrial-concessions.py
      - name: Validate cache
        run: |
          python - <<'PY'
          import json
          p=json.load(open("map/data/industrial-zones-cache-v1.json", encoding="utf-8"))
          n=p.get("concessions",{}).get("featureCount",0)
          assert n > 0, f"Expected concession polygons, got {n}"
          print("Concession polygons:", n)
          PY
      - name: Commit updated cache
        run: |
          if git diff --quiet -- map/data/industrial-zones-cache-v1.json; then
            echo "No concession changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map/data/industrial-zones-cache-v1.json
          git commit -m "Refresh official Pernik concession cache"
          git push
