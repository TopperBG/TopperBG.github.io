name: Refresh national concession sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"
      timezone: "Europe/Sofia"
  push:
    paths:
      - "scripts/refresh-industrial-concessions.py"
      - "scripts/build-concession-baseline.mjs"
      - "map/data/concession-boundaries-official-source-v2.json"
      - ".github/workflows/refresh-industrial-concessions.yml"

permissions:
  contents: write

concurrency:
  group: refresh-industrial-concessions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install reproducible Bulgarian coordinate transform
        run: npm install --no-save --no-package-lock transformations@2.0.0

      - name: Build repository concession baseline
        run: node scripts/build-concession-baseline.mjs

      - name: Check primary and fallback concession sources
        run: python scripts/refresh-industrial-concessions.py

      - name: Validate last-known-good cache and source health
        run: |
          python - <<'PY'
          import json
          cache=json.load(open("map/data/industrial-zones-cache-v1.json", encoding="utf-8"))
          health=json.load(open("map/data/gis-source-health-v1.json", encoding="utf-8"))
          assert cache.get("schema") == "bgwf-industrial-zones-cache-v1"
          section=cache.get("concessions",{})
          features=section.get("features") or []
          assert int(section.get("featureCount", len(features)) or 0) == len(features)
          if len(features) == 0:
              print("::warning title=Concession geometry baseline empty::No official-register polygon passed the publication gate.")
          else:
              for f in features:
                  p=f.get("properties") or {}
                  assert p.get("source_kind") == "official-coordinate-register"
                  assert p.get("geometry_status") == "repository-baseline-official-register-transformed"
                  assert float(p.get("area_qa_error_pct", 999)) <= 2.0
              print("Validated official-register baseline polygons:", len(features))
          assert health.get("schema") == "bgwf-gis-source-health-v1"
          sources=health.get("concessions",{}).get("sources") or []
          ids={s.get("id") for s in sources}
          assert {"DATA-EGOV-BG","NKR","ME-CONCESSIONS"} <= ids
          if not features:
              print("::warning title=Concession geometry baseline incomplete::No repository concession polygons yet; metadata source checks still run and the map will show a visible warning.")
          failed=[s.get("id") for s in sources if not s.get("ok")]
          if failed:
              print("::warning title=Some official sources unavailable::" + ", ".join(failed) + ". Last-known-good cache is preserved.")
          print("Concession polygons preserved:", len(features))
          print("Active registry source:", health.get("concessions",{}).get("activeRegistrySource"))
          PY

      - name: Commit source-health/cache metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- map/data/industrial-zones-cache-v1.json map/data/gis-source-health-v1.json; then
            echo "No source-health changes."
            exit 0
          fi

          # Fast path: publish the already validated snapshot without repeating
          # external checks. Only rebuild if main moved and the push races.
          git add map/data/industrial-zones-cache-v1.json map/data/gis-source-health-v1.json
          git commit -m "Refresh national concession source health"
          if git push origin HEAD:main; then
            exit 0
          fi

          for attempt in 2 3; do
            echo "::warning title=Concurrent main update::Push race; rebuilding on latest main (attempt ${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-concession-baseline.mjs
            python scripts/refresh-industrial-concessions.py

            if git diff --quiet -- map/data/industrial-zones-cache-v1.json map/data/gis-source-health-v1.json; then
              echo "Latest main already contains equivalent generated data."
              exit 0
            fi

            git add map/data/industrial-zones-cache-v1.json map/data/gis-source-health-v1.json
            git commit -m "Refresh national concession source health"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "::error title=Source-health commit failed::Could not publish after 3 attempts."
          exit 1
