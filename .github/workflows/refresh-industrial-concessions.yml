name: Refresh industrial concessions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"
      timezone: "Europe/Sofia"
  push:
    paths:
      - "scripts/refresh-industrial-concessions.py"
      - ".github/workflows/refresh-industrial-concessions.yml"

permissions:
  contents: write

concurrency:
  group: refresh-industrial-concessions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install projection support
        run: python -m pip install --disable-pip-version-check pyproj
      - name: Refresh official Pernik concession polygons
        run: python scripts/refresh-industrial-concessions.py
      - name: Validate cache
        run: |
          python - <<'PY'
          import json
          path="map/data/industrial-zones-cache-v1.json"
          p=json.load(open(path, encoding="utf-8"))
          assert p.get("schema") == "bgwf-industrial-zones-cache-v1"
          section=p.get("concessions",{})
          features=section.get("features") or []
          declared=int(section.get("featureCount", len(features)) or 0)
          assert declared == len(features), f"featureCount={declared}, actual={len(features)}"
          if not features:
              print("::warning title=Concession cache empty::No cached official concession polygons yet; MGU may be temporarily unavailable.")
          else:
              print("Concession polygons:", len(features))
          PY
      - name: Commit updated cache
        run: |
          if git diff --quiet -- map/data/industrial-zones-cache-v1.json; then
            echo "No concession changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map/data/industrial-zones-cache-v1.json
          git commit -m "Refresh official Pernik concession cache"
          git pull --rebase origin main
          git push
