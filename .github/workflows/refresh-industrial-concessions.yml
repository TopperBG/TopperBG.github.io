name: Refresh national concession sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"
      timezone: "Europe/Sofia"
  push:
    paths:
      - "scripts/refresh-industrial-concessions.py"
      - "scripts/sync-concession-inventory.py"
      - "scripts/sync-nkr-party-index.py"
      - "scripts/harvest-nkr-priority-documents.py"
      - "scripts/snapshot-industrial-footprints.py"
      - "scripts/build-concession-baseline.mjs"
      - "map/data/concession-boundaries-official-source-v2.json"
      - ".github/workflows/refresh-industrial-concessions.yml"

permissions:
  contents: write

concurrency:
  group: refresh-industrial-concessions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install data parsers and reproducible Bulgarian coordinate transform
        run: |
          python -m pip install --disable-pip-version-check xlrd==2.0.1 requests==2.32.5 beautifulsoup4==4.14.2 lxml==6.0.2
          npm install --no-save --no-package-lock transformations@2.0.0

      - name: Refresh repository-owned national inventory
        run: python scripts/sync-concession-inventory.py

      - name: Refresh repository-owned NKR party index
        run: python scripts/sync-nkr-party-index.py

      - name: Archive NKR party documents for pending geometries
        run: python scripts/harvest-nkr-priority-documents.py

      - name: Build repository concession baseline and pending queue
        run: node scripts/build-concession-baseline.mjs

      - name: Snapshot known industrial and disturbed-land polygons
        run: python scripts/snapshot-industrial-footprints.py

      - name: Check primary and fallback concession sources
        run: python scripts/refresh-industrial-concessions.py

      - name: Validate last-known-good cache and source health
        run: |
          python - <<'PY'
          import json
          cache=json.load(open("map/data/industrial-zones-cache-v1.json", encoding="utf-8"))
          health=json.load(open("map/data/gis-source-health-v1.json", encoding="utf-8"))
          inventory=json.load(open("map/data/concession-inventory-v1.json", encoding="utf-8"))
          baseline=json.load(open("map/data/official-concessions-baseline.geojson", encoding="utf-8"))
          pending=json.load(open("map/data/pending-concessions-v1.json", encoding="utf-8"))
          disturbed=json.load(open("map/data/disturbed-mining-sites-v1.geojson", encoding="utf-8"))
          abandoned=json.load(open("map/data/abandoned-mining-waste-inventory-v1.json", encoding="utf-8"))
          nkr_index=json.load(open("map/data/nkr-party-index-v1.json", encoding="utf-8"))
          nkr_docs=json.load(open("map/data/nkr-party-documents-v1.json", encoding="utf-8"))
          industry_snapshot=json.load(open("map/data/industry-footprints-baseline.geojson", encoding="utf-8"))
          assert cache.get("schema") == "bgwf-industrial-zones-cache-v1"
          assert inventory.get("schema") == "bgwf-concession-inventory-v1"
          assert baseline.get("schema") == "bgwf-official-concessions-baseline-v1"
          assert pending.get("schema") == "bgwf-pending-concessions-v1"
          assert disturbed.get("schema") == "bgwf-disturbed-mining-sites-v1"
          assert abandoned.get("schema") == "bgwf-abandoned-mining-waste-inventory-v1"
          assert nkr_index.get("schema") == "bgwf-nkr-party-index-v1"
          assert nkr_docs.get("schema") == "bgwf-nkr-party-documents-v1"
          assert industry_snapshot.get("schema") == "bgwf-industry-footprints-baseline-v1"
          assert int(inventory.get("recordCount",0)) == len(inventory.get("records") or [])
          if inventory.get("recordCount",0) < 50:
              print("::warning title=National concession inventory incomplete::Only",inventory.get("recordCount",0),"records are archived.")
          section=cache.get("concessions",{})
          features=baseline.get("features") or []
          assert int(baseline.get("featureCount", len(features)) or 0) == len(features)
          assert int(section.get("featureCount", len(section.get("features") or [])) or 0) == len(section.get("features") or [])
          assert int(pending.get("publishedGeometryCount",0)) == len(features)
          if len(features) == 0:
              print("::warning title=Concession geometry baseline empty::No official-register polygon passed the publication gate.")
          else:
              for f in features:
                  p=f.get("properties") or {}
                  assert p.get("source_kind") == "official-coordinate-register"
                  assert p.get("geometry_status") == "repository-baseline-official-register-transformed"
                  assert float(p.get("area_qa_error_pct", 999)) <= 2.0
              print("Validated official-register baseline polygons:", len(features))
          assert health.get("schema") == "bgwf-gis-source-health-v1"
          sources=health.get("concessions",{}).get("sources") or []
          ids={s.get("id") for s in sources}
          assert {"DATA-EGOV-BG","NKR","ME-CONCESSIONS"} <= ids
          if not features:
              print("::warning title=Concession geometry baseline incomplete::No repository concession polygons yet; metadata source checks still run and the map will show a visible warning.")
          failed=[s.get("id") for s in sources if not s.get("ok")]
          if failed:
              print("::warning title=Some official sources unavailable::" + ", ".join(failed) + ". Last-known-good cache is preserved.")
          print("National concession inventory:", inventory.get("recordCount",0))
          print("Concession polygons preserved:", len(features))
          print("Pending geometry queue:", pending.get("pendingCount",0))
          print("Disturbed/mining polygons archived:", disturbed.get("featureCount",0))
          print("Official abandoned/mining-waste inventory:", abandoned.get("recordCount",0))
          print("NKR party index:", nkr_index.get("recordCount",0), "records; inventory links:", nkr_index.get("stats",{}).get("inventoryIdsWithNkrParty",0))
          print("NKR party documents archived:", nkr_docs.get("archivedOkCount",0), "file links:", nkr_docs.get("totalFileLinks",0))
          print("Industry polygons archived:", industry_snapshot.get("featureCount",0))
          print("Active registry source:", health.get("concessions",{}).get("activeRegistrySource"))
          PY

      - name: Commit source-health/cache metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TRACKED_GENERATED=(
            map/data/industrial-zones-cache-v1.json
            map/data/gis-source-health-v1.json
            map/data/concession-inventory-v1.json
            map/data/nkr-party-index-v1.json
            map/data/nkr-party-documents-v1.json
            map/data/official-concessions-baseline.geojson
            map/data/pending-concessions-v1.json
            map/data/industry-footprints-baseline.geojson
            map/data/disturbed-mining-sites-v1.geojson
            map/data/disturbed-mining-sites-pending-v1.json
            map/data/abandoned-mining-waste-inventory-v1.json
            map/data/source-archive/concessions
          )

          if git diff --quiet -- "${TRACKED_GENERATED[@]}"; then
            echo "No source-health changes."
            exit 0
          fi

          # Fast path: publish the already validated snapshot without repeating
          # external checks. Only rebuild if main moved and the push races.
          git add "${TRACKED_GENERATED[@]}"
          git commit -m "Refresh national concession source health"
          if git push origin HEAD:main; then
            exit 0
          fi

          for attempt in 2 3; do
            echo "::warning title=Concurrent main update::Push race; rebuilding on latest main (attempt ${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync-concession-inventory.py
            python scripts/sync-nkr-party-index.py
            python scripts/harvest-nkr-priority-documents.py
            node scripts/build-concession-baseline.mjs
            python scripts/snapshot-industrial-footprints.py
            python scripts/refresh-industrial-concessions.py

            if git diff --quiet -- "${TRACKED_GENERATED[@]}"; then
              echo "Latest main already contains equivalent generated data."
              exit 0
            fi

            git add "${TRACKED_GENERATED[@]}"
            git commit -m "Refresh national concession source health"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "::error title=Source-health commit failed::Could not publish after 3 attempts."
          exit 1
