name: Refresh Natura 2000

on:
  workflow_dispatch:
  schedule:
    - cron: "13 7 1 * *"
      timezone: "Europe/Sofia"
  push:
    paths:
      - "scripts/build-natura-2000.sh"
      - ".github/workflows/refresh-natura-2000.yml"

permissions:
  contents: write

concurrency:
  group: refresh-natura-2000
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Natura 2000 snapshot
        run: bash scripts/build-natura-2000.sh
      - name: Commit updated Natura files
        run: |
          if git diff --quiet -- map/data/natura-2000-bg-v1.json map/data/natura-2000-bg-v1-part-*.geojson; then
            echo "No Natura changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map/data/natura-2000-bg-v1.json map/data/natura-2000-bg-v1-part-*.geojson
          git commit -m "Refresh Natura 2000 snapshot"
          git pull --rebase origin main
          git push
