name: Identify Kazanlak FEC parcel and favicon

on:
  push:
    paths:
      - '.github/workflows/identify-kazanlak-fec.yml'

permissions:
  contents: write

jobs:
  identify-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query cadastral parcel at supplied coordinate and patch favicon
        shell: python
        run: |
          from pathlib import Path
          import json, urllib.parse, urllib.request

          lat, lon = 42.595709, 25.397779
          base = 'https://spp.api.bg/arcgis/rest/services/Public/CadBaseMap/MapServer/2/query'
          params = {
            'where':'1=1',
            'geometry':f'{lon},{lat}',
            'geometryType':'esriGeometryPoint',
            'inSR':'4326',
            'spatialRel':'esriSpatialRelIntersects',
            'outFields':'*',
            'returnGeometry':'true',
            'outSR':'4326',
            'f':'json'
          }
          url = base + '?' + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={'User-Agent':'TopperBG-EnergoKarta/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
            data = json.load(r)
          Path('data').mkdir(exist_ok=True)
          Path('data/kazanlak-fec-42.595709-25.397779.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          p = Path('Pozharite-Bulgaria-interactivna-karta.html')
          s = p.read_text(encoding='utf-8')
          fav = '''<link rel="icon" type="image/svg+xml" href="/energokarta-favicon.svg">\n<link rel="alternate icon" href="/energokarta-favicon.svg">\n<link rel="apple-touch-icon" href="/energokarta-favicon.svg">\n'''
          if 'energokarta-favicon.svg' not in s:
            s = s.replace('</head>', fav + '</head>', 1)
            p.write_text(s, encoding='utf-8')

      - name: Commit results
        run: |
          git config user.name "TopperBG map bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kazanlak-fec-42.595709-25.397779.json Pozharite-Bulgaria-interactivna-karta.html
          git commit -m "Identify Kazanlak FEC parcel and add bookmark favicon links" || exit 0
          git push
