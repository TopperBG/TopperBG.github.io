name: Add Belashtitsa quarries
on:
  push:
    paths: ['.github/workflows/add-belashtitsa-quarries.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map
        shell: python
        run: |
          from pathlib import Path
          p=Path('Pozharite-Bulgaria-interactivna-karta.html')
          s=p.read_text(encoding='utf-8')
          if 'bgwf-belashtitsa-quarries' in s: raise SystemExit('already installed')
          block=r'''\n<script id="bgwf-belashtitsa-quarries">
/* Verified industrial/mining POI: Belashtitsa deposit, Rodopi North/South quarries.
   User observation point: 42.046039, 24.727411.
   Sources: Bulgarian Parliament; Council of Ministers/Ministry of Energy records.
   Combined reported extraction area: approx. 53 ha. Marker intentionally uses existing
   industrial-layer machinery; it does NOT claim the point geometry is the concession boundary. */
(function(){
 const rec={name:'Кариери „Белащица“ — Родопи Север / Родопи Юг',lat:42.046039,lon:24.727411,type:'Кариера / добив на строителни материали',area:'≈ 53 ha обща добивна площ на двете кариери',material:'мрамори / строителни материали',operator:'„Холсим Кариерни материали Пловдив“ АД / „Европейски пътища“ АД (исторически концесионери)',note:'Находище „Белащица“. Точката е ориентир към видимия нарушен терен; не представлява официална концесионна граница.',source:'Народно събрание; Министерство на енергетиката / Решение №528 на МС от 2008 г.'};
 window.BGWF_EXTRA_INDUSTRIAL=window.BGWF_EXTRA_INDUSTRIAL||[]; window.BGWF_EXTRA_INDUSTRIAL.push(rec);
 function add(){
  try{
   if(!window.map||!window.ol) return setTimeout(add,500);
   let layer=null;
   map.getLayers().forEach(function(l){const t=((l.get&&l.get('title'))||'')+' '+((l.get&&l.get('name'))||'');if(/ТЕЦ|мини|industry|industrial/i.test(t)&&l.getSource&&l.getSource()&&l.getSource().addFeature) layer=l;});
   if(!layer) return setTimeout(add,700);
   const f=new ol.Feature({geometry:new ol.geom.Point(ol.proj.fromLonLat([rec.lon,rec.lat])),...rec,bgwfKind:'industrial',kind:'mine',category:'mine'});
   layer.getSource().addFeature(f);
  }catch(e){console.warn('Belashtitsa quarry marker',e)}
 }
 add();
})();
</script>\n'''
          s=s.replace('</body>',block+'</body>',1)
          s=s.replace('v0.85y-verified-solar-polygons-cleanup-20260827','v0.86a-belashtitsa-quarries-20260831',1)
          s=s.replace('· v0.85y</title>','· v0.86a</title>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'TopperBG map bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Pozharite-Bulgaria-interactivna-karta.html
          git commit -m 'Industrial layer: add Belashtitsa quarries'
          git push
