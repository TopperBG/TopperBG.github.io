name: Refresh Bulgaria renewable inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    paths:
      - scripts/refresh-bg-renewables.py
      - scripts/enrich-bg-renewable-locations.py
      - map/data/bg-renewables-identities-v1.json
      - .github/workflows/refresh-bg-renewables.yml
      - map/index.html
permissions:
  contents: write
concurrency:
  group: bg-renewables-cache
  cancel-in-progress: true
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Remove the merged PR 4 branch if unchanged
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cleanup-merged-inventory]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! cleanup_branch_sha=$(gh api "repos/$GH_REPO/git/ref/heads/feat/national-renewables-cache" --jq '.object.sha' 2>/dev/null); then
            echo "Inventory branch already absent."
            exit 0
          fi
          if [ "$cleanup_branch_sha" != "2cda29ae1afe1d1b411994480242d75df467b052" ]; then
            echo "Inventory branch has newer commits; keeping it."
            exit 0
          fi
          cleanup_pr_merged=$(gh api "repos/$GH_REPO/pulls/4" --jq '.merged')
          if [ "$cleanup_pr_merged" = "true" ]; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/feat/national-renewables-cache"
            echo "Deleted merged inventory branch."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/test-bg-renewables.py
      - run: python -m unittest discover -s tests -p test_bg_renewables.py
      - run: python scripts/refresh-bg-renewables.py
      - run: python scripts/enrich-bg-renewable-locations.py
      - run: python scripts/refresh-bg-renewables.py --reconcile-only
      - run: node scripts/test-renewables-list.cjs
      - name: Publish cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add map/data/bg-renewables-cache-v1.geojson map/data/bg-renewables-health-v1.json map/data/bg-renewables-locations-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Bulgaria renewable inventory >1 MW'
          git pull --rebase origin main
          python scripts/bump-map-version.py
          python scripts/bump-map-version.py --check
          git add map/data/map-version.json map/index.html map/renewables.html
          git commit --amend --no-edit
          git push origin HEAD:main
